<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牌阵图鉴 · 10 种经典塔罗牌阵 · 月影塔罗</title>
<meta name="description" content="十种塔罗牌阵详解：位置含义、适用问题与占卜结构说明。">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
</head>
<body>

<canvas id="starfield"></canvas>

<header class="site-header">
  <nav class="nav wrap">
    <a class="brand" href="index.html"><span class="sigil-mark">✦</span>月影塔罗</a>
    <div class="nav-links">
      <a href="index.html">主页</a>
      <a href="basic.html">基础占卜</a>
      <a href="deep.html">深度占卜</a>
      <a href="spreads.html" class="is-active">牌阵图鉴</a>
      <a href="cards.html">塔罗牌图鉴</a>
      <a href="guide.html">使用指南</a>
    </div>
  </nav>
</header>

<section class="wrap" style="padding-top:46px;text-align:center">
  <span class="eyebrow">Spread Library</span>
  <h1 style="font-size:clamp(1.8rem,4.4vw,2.8rem);margin:16px 0 10px">牌阵图鉴</h1>
  <p class="muted" style="max-width:760px;margin:0 auto">
    十种牌阵，四种属于基础占卜（仅用 22 张大阿卡纳），六种属于深度占卜（启用完整 78 张）。
    每一种牌阵都是为特定类型的问题设计的——牌阵不是越多越好，而是越贴合问题越好。
  </p>
</section>

<section class="wrap" style="padding:40px 0 70px">
  <div class="card-filters">
    <button type="button" class="filter-btn is-active" data-filter="all">全部牌阵</button>
    <button type="button" class="filter-btn" data-filter="basic">基础占卜</button>
    <button type="button" class="filter-btn" data-filter="deep">深度占卜</button>
  </div>
  <div id="spreadDetailList"></div>
</section>

<footer class="site-footer">
  <div class="footer-inner wrap">
    <div class="footer-sigil">☾ ✦ ☽</div>
    <p>月影塔罗 · 《计算机基础》课程设计作品</p>
    <div class="footer-links">
      <a href="index.html">主页</a>
      <a href="basic.html">基础占卜</a>
      <a href="deep.html">深度占卜</a>
      <a href="cards.html">塔罗牌图鉴</a>
      <a href="guide.html">使用指南</a>
    </div>
  </div>
</footer>

<script src="js/cards-major.js"></script>
<script src="js/cards-minor.js"></script>
<script src="js/spreads.js"></script>
<script src="js/deck.js"></script>
<script src="js/starfield.js"></script>
<script>

(function () {
  var list = document.getElementById('spreadDetailList');

  function render(filter) {
    list.innerHTML = '';
    TAROT_SPREADS.filter(function (s) { return filter === 'all' || s.level === filter; })
      .forEach(function (s) {
        var lv = TAROT_LEVELS[s.level];
        var d = document.createElement('div');
        d.className = 'spread-detail';
        d.id = s.id;

        var posHtml = s.positions.map(function (p) {
          return '<div class="pos-row"><b>' + p.no + '. ' + p.name + '</b><span>' + p.desc + '</span></div>';
        }).join('');

        var qHtml = s.questions.map(function (q) {
          return '<span class="q-chip">' + q + '</span>';
        }).join('');

        d.innerHTML =
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap">' +
          '<div><h3>' + s.name + '</h3><span class="sd-en">' + s.en + ' · ' + s.cards + ' 张牌</span></div>' +
          '<span class="q-chip">' + lv.name + ' · ' + lv.subtitle + '</span>' +
          '</div>' +
          '<p class="sd-intro">' + s.intro + '</p>' +
          '<div class="pos-table">' + posHtml + '</div>' +
          '<div style="margin-top:16px"><b class="gold" style="font-size:.9rem">备选问题：</b>' +
          '<div class="q-chip-list">' + qHtml + '</div></div>' +
          '<div class="hero-actions" style="justify-content:flex-start;margin-top:18px">' +
          '<a class="btn btn-mystic" href="' + (s.level === 'basic' ? 'basic.html' : 'deep.html') + '">用这个牌阵占卜 →</a>' +
          '</div>';
        list.appendChild(d);
      });
  }

  var btns = document.querySelectorAll('.filter-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function () {
      for (var j = 0; j < btns.length; j++) btns[j].classList.remove('is-active');
      this.classList.add('is-active');
      render(this.getAttribute('data-filter'));
    });
  }
  render('all');
})();
</script>
</body>
</html>
